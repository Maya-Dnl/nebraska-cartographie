<div>
  <mat-dialog-content class="custom-pop-up">
    <div data-testid="popup-message" [innerHTML]="message"></div>
    <mat-dialog-actions>
      <div class="btn-custom">
        @if (modePopup === 0) {
          <button class="custom-btn-popup" mat-dialog-close data-testid="popup-ok-button">Ok</button>
        }@else if (modePopup === 1) {
          <button class="btn-error-popup" [mat-dialog-close]="true" data-testid="popup-yes-button">Oui</button>
          <button class="btn-error-popup" mat-dialog-close data-testid="popup-no-button">Non</button>
        }@else if (modePopup === 2) {
          <button class="custom-btn-popup" [mat-dialog-close]="'ResendMailConfirm'" data-testid="popup-resend-mail-button">Renvoyer l'email</button>
          <button class="custom-btn-popup" mat-dialog-close data-testid="popup-ok-button">Ok</button>
        }
        @else if (modePopup === 3) {
          <button class="custom-btn-popup" [mat-dialog-close]="true" data-testid="popup-ok-button">Ok</button>
          <button class="custom-btn-popup" mat-dialog-close data-testid="popup-return-button">Retour</button>
        }
        @else if (modePopup === 4) {
          <button class="custom-btn-popup" [mat-dialog-close]="true" data-testid="popup-accept-button">J'accepte</button>
          <button class="custom-btn-popup" mat-dialog-close data-testid="popup-return-button">Retour</button>
        }
      </div>
    </mat-dialog-actions>
  </mat-dialog-content>
</div>
